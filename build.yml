name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o iptv-app.zip -d /tmp/z
          cd /tmp/z
          if [ "$(ls -1 | wc -l)" = "1" ] && [ -d "$(ls -1)" ]; then cd "$(ls -1)"; fi
          cp -r . "$GITHUB_WORKSPACE"/

      - name: Patch activation (demo)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name activation.ts -not -path "*/node_modules/*"); do
            printf "import { Session } from '../types';\n\nexport async function activate(code: string): Promise<Session> {\n  if (!code.trim()) throw new Error('اكتب كود التفعيل');\n  return { server: 'http://demo', username: 'demo', password: 'demo' };\n}\n" > "$f"
          done

      - name: Patch xtream (demo)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name xtream.ts -not -path "*/node_modules/*"); do
          cat > "$f" << 'EOF'
          import { Category, Item, Kind, Session, SeriesInfo } from '../types';

          export async function authenticate(s: Session) {
            return { status: 'Active', exp_date: '2027-01-01', max_connections: '5', username: s.username };
          }

          const COLORS = ['7c5cff', 'e5484d', '30a46c', 'f5a524', '0091ff', 'd6409f'];
          const av = (n: string, i: number) =>
            `https://ui-avatars.com/api/?name=${encodeURIComponent(n)}&background=${COLORS[i % COLORS.length]}&color=fff&size=256&bold=true`;

          const LIVE_CATS: Record<string, { name: string; items: string[] }> = {
            '1': { name: 'أخبار', items: ['BBC News', 'CNN', 'Al Jazeera', 'Sky News', 'France 24', 'DW News'] },
            '2': { name: 'رياضة', items: ['ESPN', 'Sky Sports', 'beIN Sports', 'Eurosport', 'Fox Sports', 'BT Sport'] },
            '3': { name: 'أفلام ومسلسلات', items: ['HBO', 'Showtime', 'AMC', 'TNT', 'FX', 'Starz'] },
            '4': { name: 'أطفال', items: ['Cartoon Network', 'Disney Channel', 'Nickelodeon', 'Baby TV', 'Boomerang'] },
            '5': { name: 'موسيقى', items: ['MTV', 'VH1', 'Trace', 'Vevo', 'Mezzo'] },
          };

          const MOVIE_CATS: Record<string, { name: string; items: string[] }> = {
            '11': { name: 'أكشن', items: ['Mad Max Fury Road', 'John Wick', 'Gladiator', 'Die Hard', 'The Dark Knight'] },
            '12': { name: 'خيال علمي', items: ['Inception', 'Interstellar', 'The Matrix', 'Avatar', 'Blade Runner'] },
            '13': { name: 'دراما', items: ['The Godfather', 'Titanic', 'Forrest Gump', 'Shawshank Redemption', 'Fight Club'] },
            '14': { name: 'كوميدي', items: ['The Hangover', 'Home Alone', 'Superbad', 'Mean Girls', 'Bruce Almighty'] },
          };

          export async function getCategories(s: Session, kind: Kind): Promise<Category[]> {
            const src = kind === 'live' ? LIVE_CATS : kind === 'movie' ? MOVIE_CATS : {};
            return Object.keys(src).map((id) => ({ category_id: id, category_name: (src as any)[id].name }));
          }

          export async function getItems(s: Session, kind: Kind, categoryId: string): Promise<Item[]> {
            const src: any = kind === 'live' ? LIVE_CATS : kind === 'movie' ? MOVIE_CATS : {};
            const cat = src[categoryId];
            if (!cat) return [];
            return cat.items.map((n: string, i: number) => ({
              id: Number(categoryId) * 100 + i,
              name: n,
              image: av(n, i),
              ext: 'mp4',
            }));
          }

          export const getSeriesInfo = async (s: Session, id: number): Promise<SeriesInfo> => ({} as any);

          export const liveUrl = (s: Session, id: number) => 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
          export const movieUrl = (s: Session, id: number, ext = 'mp4') => 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
          export const episodeUrl = (s: Session, id: string, ext = 'mp4') => 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
          EOF
          done
          
      - name: Patch player (simple)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name PlayerScreen.tsx -not -path "*/node_modules/*"); do
          cat > "$f" << 'EOF'
          import React, { useEffect, useState } from 'react';
          import { ActivityIndicator, Pressable, StyleSheet, Text, View } from 'react-native';
          import { useVideoPlayer, VideoView } from 'expo-video';
          import { Ionicons } from '@expo/vector-icons';
          import { colors } from '../theme';

          export default function PlayerScreen({ route, navigation }: any) {
            const { url, title, live } = route.params;
            const [status, setStatus] = useState('loading');

            const player = useVideoPlayer(url, (p) => {
              p.loop = false;
              p.play();
            });

            useEffect(() => {
              const sub = player.addListener('statusChange', (e: any) => setStatus(e.status));
              return () => sub.remove();
            }, [player]);

            return (
              <View style={s.wrap}>
                <VideoView player={player} style={s.video} nativeControls contentFit="contain" />
                <Pressable style={s.back} onPress={() => navigation.goBack()} hitSlop={12}>
                  <Ionicons name="arrow-back" size={26} color="#fff" />
                  <Text style={s.title} numberOfLines={1}>{title}{live ? '  •  مباشر' : ''}</Text>
                </Pressable>
                {status === 'loading' && <ActivityIndicator style={StyleSheet.absoluteFill} size="large" color={colors.primary} />}
                {status === 'error' && <Text style={s.err}>تعذّر تشغيل هذا المحتوى</Text>}
              </View>
            );
          }

          const s = StyleSheet.create({
            wrap: { flex: 1, backgroundColor: '#000' },
            video: { flex: 1 },
            back: { position: 'absolute', top: 40, left: 16, right: 16, flexDirection: 'row', alignItems: 'center', gap: 10 },
            title: { color: '#fff', fontSize: 16, fontWeight: '700', flex: 1 },
            err: { position: 'absolute', alignSelf: 'center', top: '45%', color: colors.danger, fontSize: 16 },
          });
          EOF
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix package.json versions
        run: |
          rm -rf node_modules package-lock.json android
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies = Object.assign({}, p.dependencies, {
            'expo': '~51.0.39',
            'expo-video': '~1.2.7',
            'expo-modules-core': '~1.12.26',
            'expo-font': '~12.0.10',
            'react-native-safe-area-context': '4.10.5',
            'react-native-screens': '~3.31.1',
            '@react-navigation/native': '^6.1.18',
            '@react-navigation/native-stack': '^6.11.0',
            '@react-navigation/bottom-tabs': '^6.6.1',
            '@react-native-async-storage/async-storage': '1.23.1',
            'expo-secure-store': '~13.0.2'
          });
          p.overrides = Object.assign({}, p.overrides, {
            'expo-modules-core': '~1.12.26',
            'expo-font': '~12.0.10'
          });
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Install Dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Auto-install missing libraries
        run: |
          for i in 1 2 3 4 5; do
            OUT=$(npx expo export --platform android 2>&1 || true)
            MISSING=$(echo "$OUT" | grep -oP "Unable to resolve module \K[^ ]+" | head -1)
            if [ -z "$MISSING" ]; then break; fi
            echo "Installing missing: $MISSING"
            npx expo install "$MISSING" || npm install "$MISSING"
          done

      - name: Build Local APK
        run: |
          npx expo prebuild --platform android --clean
          mkdir -p android/app/src/main/res/values
          if ! grep -rq "splashscreen_background" android/app/src/main/res/values/; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splashscreen_background">#000000</color>\n</resources>\n' > android/app/src/main/res/values/splash_fix.xml
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
