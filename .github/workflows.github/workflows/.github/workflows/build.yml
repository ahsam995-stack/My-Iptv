name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o iptv-app.zip -d /tmp/z
          cd /tmp/z
          if [ "$(ls -1 | wc -l)" = "1" ] && [ -d "$(ls -1)" ]; then cd "$(ls -1)"; fi
          cp -r . "$GITHUB_WORKSPACE"/

      - name: Patch activation (200171)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name activation.ts -not -path "*/node_modules/*"); do
            printf "import { Session } from '../types';\n\nexport async function activate(code: string): Promise<Session> {\n  const validCode = '200171';\n  if (code.trim() !== validCode) throw new Error('كود التفعيل غير صحيح، حاول مرة أخرى');\n  return { success: true, serverUrl: 'http://localhost', username: code.trim(), password: 'password' };\n}\n" > "$f"
          done

      - name: Patch xtream (free content + YouTube)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name xtream.ts -not -path "*/node_modules/*"); do
          cat > "$f" << 'EOF'
          import { Category, Item, Kind, Session, SeriesInfo } from '../types';

          export async function authenticate(s: Session) {
            return { status: 'Active', exp_date: '2027-01-01', max_connections: '5', username: s.username };
          }

          // ---------- helpers ----------
          let counter = 1000;
          const urlById = new Map<number, string>();
          const seriesById = new Map<number, string>();
          const NOIMG = 'https://placehold.co/400x400/111827/ffffff.png';
          const arImg = (id: string) => `https://archive.org/services/img/${id}`;
          const ytUrl = (vid: string) => `https://www.youtube.com/watch?v=${vid}`;
          const ytImg = (vid: string) => `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;

          // ---------- YOUTUBE: عدّل هذي القوائم وضيف فيديوهاتك ----------
          // vid = الجزء الأخير من رابط اليوتيوب بعد v=
          const YT_VIDEOS: { title: string; vid: string }[] = [
            { title: 'Big Buck Bunny', vid: 'aqz-KE-bpKQ' },
            { title: 'Sintel', vid: 'eRsGyueVLvQ' },
            { title: 'Tears of Steel', vid: 'R6MlUcmOul8' },
            { title: 'ابن عباد', vid: '23HNDEik2fU' },
          ];
          // بثوث مباشرة (أرقامها ممكن تتغير وبعضها ما يسمح بالتشغيل داخل التطبيق)
          const YT_LIVE: { title: string; vid: string }[] = [
            { title: 'الجزيرة', vid: '0zc9dACzJYY' },
            { title: 'سكاي نيوز عربية', vid: 'DTuF6hCLCGw' },
            { title: 'العربية', vid: 'h9gGE5QxanU' },
          ];
          const ytItems = (list: { title: string; vid: string }[]): Item[] =>
            list.map((v) => {
              const id = ++counter;
              urlById.set(id, ytUrl(v.vid));
              return { id, name: v.title, image: ytImg(v.vid), ext: 'mp4' } as any;
            });

          // ---------- LIVE: free public channels (with real logos) ----------
          const LIVE_M3U = 'https://iptv-org.github.io/iptv/languages/ara.m3u';
          const GROUPS: Record<string, string> = {
            News: 'أخبار', Sports: 'رياضة', Kids: 'أطفال', Movies: 'أفلام', Music: 'موسيقى',
            Religious: 'دينية', Entertainment: 'ترفيه', General: 'عامة', Documentary: 'وثائقية',
            Series: 'مسلسلات', Culture: 'ثقافة', Lifestyle: 'منوعات', Undefined: 'قنوات أخرى',
          };
          let live: { cats: Category[]; items: Record<string, Item[]> } | null = null;

          async function loadLive() {
            if (live) return live;
            const text = await (await fetch(LIVE_M3U)).text();
            const lines = text.split(/\r?\n/);
            const items: Record<string, Item[]> = {};
            for (let i = 0; i < lines.length; i++) {
              const l = lines[i];
              if (!l.startsWith('#EXTINF')) continue;
              let url = '';
              for (let j = i + 1; j < lines.length; j++) {
                if (lines[j].trim() && !lines[j].startsWith('#')) { url = lines[j].trim(); break; }
              }
              if (!url.startsWith('https://')) continue;
              const attrs: Record<string, string> = {};
              l.replace(/([\w-]+)="([^"]*)"/g, (_m, k, v) => { attrs[k] = v; return ''; });
              const name = l.substring(l.lastIndexOf(',') + 1).trim();
              if (!name) continue;
              const g = (attrs['group-title'] || 'Undefined').split(';')[0] || 'Undefined';
              const id = ++counter;
              urlById.set(id, url);
              (items[g] = items[g] || []).push({ id, name, image: attrs['tvg-logo'] || NOIMG, ext: 'm3u8' } as any);
            }
            const cats = Object.keys(items).map((g) => ({ category_id: 'L:' + g, category_name: GROUPS[g] || g }));
            live = { cats, items };
            return live;
          }

          // ---------- MOVIES / SERIES: Internet Archive (public domain) ----------
          const MOVIE_CATS: Record<string, { name: string; q: string }> = {
            '11': { name: 'أفلام كلاسيكية (ملك عام)', q: 'collection:feature_films AND mediatype:movies' },
            '12': { name: 'أفلام عربية', q: 'mediatype:movies AND (language:Arabic OR subject:arabic)' },
            '13': { name: 'أفلام كرتون', q: 'collection:animationandcartoons AND mediatype:movies' },
            '14': { name: 'يوتيوب', q: '' },
          };
          const SERIES_CATS: Record<string, { name: string; q: string }> = {
            '21': { name: 'مسلسلات كلاسيكية', q: 'collection:classic_tv AND mediatype:movies' },
            '22': { name: 'كرتون كلاسيكي', q: 'collection:classic_cartoons AND mediatype:movies' },
          };

          async function archiveList(q: string, rows = 24): Promise<{ identifier: string; title: any }[]> {
            const u = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl%5B%5D=identifier&fl%5B%5D=title&sort%5B%5D=downloads+desc&rows=${rows}&output=json`;
            const j = await (await fetch(u)).json();
            return j.response.docs || [];
          }

          async function mp4Files(identifier: string): Promise<string[]> {
            const j = await (await fetch(`https://archive.org/metadata/${identifier}`)).json();
            return (j.files || []).map((x: any) => x.name as string).filter((n: string) => /\.mp4$/i.test(n)).sort();
          }

          export async function getCategories(s: Session, kind: Kind): Promise<Category[]> {
            if (kind === 'live') {
              const l = await loadLive();
              return [{ category_id: 'L:YT', category_name: 'قنوات يوتيوب' } as any, ...l.cats];
            }
            const src = kind === 'movie' ? MOVIE_CATS : SERIES_CATS;
            return Object.keys(src).map((id) => ({ category_id: id, category_name: src[id].name }));
          }

          export async function getItems(s: Session, kind: Kind, categoryId: string): Promise<Item[]> {
            if (kind === 'live') {
              if (categoryId === 'L:YT') return ytItems(YT_LIVE);
              const l = await loadLive();
              return l.items[categoryId.replace('L:', '')] || [];
            }
            const src = kind === 'movie' ? MOVIE_CATS : SERIES_CATS;
            const cat = src[categoryId];
            if (!cat) return [];
            if (kind === 'movie' && categoryId === '14') return ytItems(YT_VIDEOS);
            const docs = await archiveList(cat.q);
            if (kind === 'series') {
              return docs.map((d) => {
                const id = ++counter;
                seriesById.set(id, d.identifier);
                return { id, name: String(d.title), image: arImg(d.identifier), ext: 'mp4' } as any;
              });
            }
            const out = await Promise.all(docs.map(async (d) => {
              try {
                const files = await mp4Files(d.identifier);
                if (!files.length) return null;
                const id = ++counter;
                urlById.set(id, `https://archive.org/download/${d.identifier}/${encodeURI(files[0])}`);
                return { id, name: String(d.title), image: arImg(d.identifier), ext: 'mp4' } as any;
              } catch { return null; }
            }));
            return out.filter(Boolean) as Item[];
          }

          export const getSeriesInfo = async (s: Session, id: number): Promise<SeriesInfo> => {
            const ident = seriesById.get(id) || '';
            let files: string[] = [];
            try { files = await mp4Files(ident); } catch {}
            return {
              info: { name: ident, cover: arImg(ident), plot: 'محتوى مجاني ملك عام من Internet Archive', cast: '', genre: 'كلاسيكي', rating: '' },
              episodes: { '1': files.slice(0, 60).map((n, i) => ({ id: `${ident}/${n}` as any, episode_num: i + 1, title: `الحلقة ${i + 1}`, container_extension: 'mp4', info: {} })) },
            } as any;
          };

          export const liveUrl = (s: Session, id: number) => urlById.get(id) || '';
          export const movieUrl = (s: Session, id: number, ext = 'mp4') => urlById.get(id) || '';
          export const episodeUrl = (s: Session, id: string, ext = 'mp4') => `https://archive.org/download/${encodeURI(String(id))}`;
          EOF
          done

      - name: Patch player (video + YouTube)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name PlayerScreen.tsx -not -path "*/node_modules/*"); do
          cat > "$f" << 'EOF'
          import React, { useEffect, useState } from 'react';
          import { ActivityIndicator, Dimensions, Pressable, StyleSheet, Text, View } from 'react-native';
          import { useVideoPlayer, VideoView } from 'expo-video';
          import YoutubePlayer from 'react-native-youtube-iframe';
          import { Ionicons } from '@expo/vector-icons';
          import { colors } from '../theme';

          const ytId = (u: string): string | null => {
            const m = String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
            return m ? m[1] : null;
          };

          function Header({ navigation, title, live }: any) {
            return (
              <Pressable style={s.back} onPress={() => navigation.goBack()} hitSlop={12}>
                <Ionicons name="arrow-back" size={26} color="#fff" />
                <Text style={s.title} numberOfLines={1}>{title}{live ? '  •  مباشر' : ''}</Text>
              </Pressable>
            );
          }

          function YouTubeScreen({ vid, navigation, title, live }: any) {
            const w = Dimensions.get('window').width;
            return (
              <View style={s.wrap}>
                <View style={{ flex: 1, justifyContent: 'center' }}>
                  <YoutubePlayer height={Math.round((w * 9) / 16)} width={w} videoId={vid} play={true} />
                </View>
                <Header navigation={navigation} title={title} live={live} />
              </View>
            );
          }

          function VideoScreen({ url, navigation, title, live }: any) {
            const [status, setStatus] = useState('loading');
            const player = useVideoPlayer(url, (p) => {
              p.loop = false;
              p.play();
            });
            useEffect(() => {
              const sub = player.addListener('statusChange', (e: any) => setStatus(e.status));
              return () => sub.remove();
            }, [player]);
            return (
              <View style={s.wrap}>
                <VideoView player={player} style={s.video} nativeControls contentFit="contain" />
                <Header navigation={navigation} title={title} live={live} />
                {status === 'loading' && <ActivityIndicator style={StyleSheet.absoluteFill} size="large" color={colors.primary} />}
                {status === 'error' && <Text style={s.err}>تعذّر تشغيل هذا المحتوى</Text>}
              </View>
            );
          }

          export default function PlayerScreen({ route, navigation }: any) {
            const { url, title, live } = route.params;
            const vid = ytId(url);
            if (vid) return <YouTubeScreen vid={vid} navigation={navigation} title={title} live={live} />;
            return <VideoScreen url={url} navigation={navigation} title={title} live={live} />;
          }

          const s = StyleSheet.create({
            wrap: { flex: 1, backgroundColor: '#000' },
            video: { flex: 1 },
            back: { position: 'absolute', top: 40, left: 16, right: 16, flexDirection: 'row', alignItems: 'center', gap: 10 },
            title: { color: '#fff', fontSize: 16, fontWeight: '700', flex: 1 },
            err: { position: 'absolute', alignSelf: 'center', top: '45%', color: colors.danger, fontSize: 16 },
          });
          EOF
          done

      - name: Patch browse screen (sections grid)
        run: |
          for f in $(find "$GITHUB_WORKSPACE" -name BrowseScreen.tsx -not -path "*/node_modules/*"); do
          cat > "$f" << 'EOF'
          import React, { useEffect, useMemo, useState } from 'react';
          import { ActivityIndicator, BackHandler, FlatList, Image, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';
          import { SafeAreaView } from 'react-native-safe-area-context';
          import { useNavigation } from '@react-navigation/native';
          import { Ionicons } from '@expo/vector-icons';
          import { useAuth } from '../store/auth';
          import { Category, Item, Kind } from '../types';
          import * as api from '../api/xtream';
          import CategoryChips from '../components/CategoryChips';
          import { colors } from '../theme';

          const COLS = 3;

          const catIcon = (name: string): any => {
            if (name.includes('يوتيوب')) return 'logo-youtube';
            if (name.includes('أخبار')) return 'newspaper';
            if (name.includes('رياضة')) return 'football';
            if (name.includes('أطفال')) return 'happy';
            if (name.includes('أفلام')) return 'film';
            if (name.includes('موسيقى')) return 'musical-notes';
            if (name.includes('دينية')) return 'moon';
            if (name.includes('وثائقية')) return 'earth';
            if (name.includes('مسلسلات')) return 'videocam';
            if (name.includes('ثقافة')) return 'book';
            if (name.includes('ترفيه') || name.includes('منوعات')) return 'sparkles';
            return 'tv';
          };

          export default function BrowseScreen({ kind }: { kind: Kind }) {
            const { session } = useAuth();
            const nav = useNavigation<any>();
            const isLive = kind === 'live';
            const [cats, setCats] = useState<Category[]>([]);
            const [cat, setCat] = useState<string | null>(null);
            const [opened, setOpened] = useState(!isLive);
            const [items, setItems] = useState<Item[]>([]);
            const [q, setQ] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            useEffect(() => {
              api.getCategories(session!, kind)
                .then((c) => {
                  setCats(c);
                  if (isLive) setLoading(false);
                  else { setCat(c[0]?.category_id ?? null); if (!c.length) setLoading(false); }
                })
                .catch((e) => { setError(e.message); setLoading(false); });
            }, [kind]);

            useEffect(() => {
              if (cat === null || !opened) return;
              setLoading(true);
              setError('');
              api.getItems(session!, kind, cat)
                .then(setItems)
                .catch((e) => setError(e.message))
                .finally(() => setLoading(false));
            }, [cat, opened]);

            const goBack = () => {
              setOpened(false);
              setCat(null);
              setItems([]);
              setQ('');
              setError('');
              setLoading(false);
            };

            useEffect(() => {
              if (!isLive || !opened) return;
              const sub = BackHandler.addEventListener('hardwareBackPress', () => { goBack(); return true; });
              return () => sub.remove();
            }, [isLive, opened]);

            const data = useMemo(() => {
              const t = q.trim().toLowerCase();
              return t ? items.filter((i) => i.name.toLowerCase().includes(t)) : items;
            }, [items, q]);

            const open = (it: Item) => {
              if (kind === 'series') return nav.navigate('SeriesDetail', { id: it.id, name: it.name });
              const url = kind === 'live' ? api.liveUrl(session!, it.id) : api.movieUrl(session!, it.id, it.ext || 'mp4');
              nav.navigate('Player', { url, title: it.name, live: kind === 'live' });
            };

            // ---------- Live: grid of sections ----------
            if (isLive && !opened) {
              return (
                <SafeAreaView style={s.wrap} edges={['top']}>
                  <Text style={s.head}>القنوات</Text>
                  {loading ? (
                    <ActivityIndicator color={colors.primary} style={{ marginTop: 40 }} />
                  ) : error ? (
                    <Text style={s.error}>{error}</Text>
                  ) : (
                    <FlatList
                      key="cats"
                      data={cats}
                      numColumns={2}
                      keyExtractor={(c) => c.category_id}
                      contentContainerStyle={{ padding: 12, gap: 12 }}
                      columnWrapperStyle={{ gap: 12 }}
                      renderItem={({ item }) => (
                        <Pressable style={s.catCard} onPress={() => { setCat(item.category_id); setOpened(true); }}>
                          <Ionicons name={catIcon(item.category_name)} size={38} color={colors.primary} />
                          <Text style={s.catText} numberOfLines={2}>{item.category_name}</Text>
                        </Pressable>
                      )}
                      ListEmptyComponent={<Text style={s.error}>لا توجد أقسام</Text>}
                    />
                  )}
                </SafeAreaView>
              );
            }

            const catName = cats.find((c) => c.category_id === cat)?.category_name || '';
            return (
              <SafeAreaView style={s.wrap} edges={['top']}>
                {isLive ? (
                  <Pressable style={s.topBar} onPress={goBack} hitSlop={10}>
                    <Ionicons name="arrow-back" size={24} color={colors.text} />
                    <Text style={s.head2}>{catName}</Text>
                  </Pressable>
                ) : null}
                <TextInput style={s.search} value={q} onChangeText={setQ} placeholder="بحث..." placeholderTextColor={colors.muted} />
                {!isLive ? <CategoryChips data={cats} selected={cat} onSelect={setCat} /> : null}
                {loading ? (
                  <ActivityIndicator color={colors.primary} style={{ marginTop: 40 }} />
                ) : error ? (
                  <Text style={s.error}>{error}</Text>
                ) : (
                  <FlatList
                    key={isLive ? 'list' : 'grid'}
                    data={data}
                    numColumns={isLive ? 1 : COLS}
                    keyExtractor={(i) => String(i.id)}
                    initialNumToRender={12}
                    maxToRenderPerBatch={12}
                    windowSize={7}
                    removeClippedSubviews
                    contentContainerStyle={{ padding: 12, gap: 10 }}
                    columnWrapperStyle={isLive ? undefined : { gap: 10 }}
                    renderItem={({ item }) =>
                      isLive ? (
                        <Pressable style={s.row} onPress={() => open(item)}>
                          {item.image ? <Image source={{ uri: item.image }} style={s.logo} resizeMode="contain" /> : <View style={s.logo} />}
                          <Text style={s.rowText} numberOfLines={1}>{item.name}</Text>
                        </Pressable>
                      ) : (
                        <Pressable style={s.card} onPress={() => open(item)}>
                          {item.image ? <Image source={{ uri: item.image }} style={s.poster} /> : <View style={s.poster} />}
                          <Text style={s.cardText} numberOfLines={2}>{item.name}</Text>
                        </Pressable>
                      )
                    }
                    ListEmptyComponent={<Text style={s.error}>لا توجد نتائج</Text>}
                  />
                )}
              </SafeAreaView>
            );
          }

          const s = StyleSheet.create({
            wrap: { flex: 1, backgroundColor: colors.bg },
            head: { color: colors.text, fontSize: 22, fontWeight: '800', margin: 16, marginBottom: 4 },
            topBar: { flexDirection: 'row', alignItems: 'center', gap: 10, paddingHorizontal: 16, paddingTop: 10 },
            head2: { color: colors.text, fontSize: 18, fontWeight: '700', flex: 1 },
            catCard: { flex: 1, backgroundColor: colors.card, borderRadius: 16, borderWidth: 1, borderColor: colors.border, paddingVertical: 26, alignItems: 'center', justifyContent: 'center', gap: 10 },
            catText: { color: colors.text, fontSize: 15, fontWeight: '700', textAlign: 'center', paddingHorizontal: 8 },
            search: { backgroundColor: colors.card, color: colors.text, margin: 12, borderRadius: 12, paddingHorizontal: 14, paddingVertical: 10, borderWidth: 1, borderColor: colors.border },
            error: { color: colors.muted, textAlign: 'center', marginTop: 40 },
            row: { flexDirection: 'row', alignItems: 'center', backgroundColor: colors.card, borderRadius: 12, padding: 10, gap: 12 },
            logo: { width: 48, height: 48, borderRadius: 8, backgroundColor: colors.border },
            rowText: { color: colors.text, fontSize: 15, flex: 1 },
            card: { flex: 1 / COLS },
            poster: { aspectRatio: 2 / 3, borderRadius: 10, backgroundColor: colors.border },
            cardText: { color: colors.text, fontSize: 12, marginTop: 6 },
          });
          EOF
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix package.json versions
        run: |
          rm -rf node_modules package-lock.json android
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies = Object.assign({}, p.dependencies, {
            'expo': '~51.0.39',
            'expo-video': '~1.2.7',
            'expo-modules-core': '~1.12.26',
            'expo-font': '~12.0.10',
            'react-native-safe-area-context': '4.10.5',
            'react-native-screens': '~3.31.1',
            '@react-navigation/native': '^6.1.18',
            '@react-navigation/native-stack': '^6.11.0',
            '@react-navigation/bottom-tabs': '^6.6.1',
            '@react-native-async-storage/async-storage': '1.23.1',
            'expo-secure-store': '~13.0.2',
            'react-native-webview': '13.8.6',
            'react-native-youtube-iframe': '^2.3.0'
          });
          p.overrides = Object.assign({}, p.overrides, {
            'expo-modules-core': '~1.12.26',
            'expo-font': '~12.0.10'
          });
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Install Dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Auto-install missing libraries
        run: |
          for i in 1 2 3 4 5; do
            OUT=$(npx expo export --platform android 2>&1 || true)
            MISSING=$(echo "$OUT" | grep -oP "Unable to resolve module \K[^ ]+" | head -1)
            if [ -z "$MISSING" ]; then break; fi
            echo "Installing missing: $MISSING"
            npx expo install "$MISSING" || npm install "$MISSING"
          done

      - name: Build Local APK
        run: |
          npx expo prebuild --platform android --clean
          mkdir -p android/app/src/main/res/values
          if ! grep -rq "splashscreen_background" android/app/src/main/res/values/; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splashscreen_background">#000000</color>\n</resources>\n' > android/app/src/main/res/values/splash_fix.xml
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
